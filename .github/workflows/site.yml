# Marketing site: build + check on every PR that touches it, and deploy to
# GitHub Pages from main.
#
# The site lives in site/ (plain HTML/CSS/JS, no framework, no runtime CDN).
# site/scripts/build.mjs assembles it into _site/ and pulls the screenshots
# from docs/media/readme and the mascot art from ui/assets, so refreshing a
# README screenshot redeploys the site too. site/scripts/check.mjs then fails
# the run on malformed HTML, broken internal links or anchors, missing
# assets, images without alt/size, or anything loaded from a third party at
# runtime. Biome lints the site's JS and CSS with the repo's config.
#
# One-time setup (repo owner): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". Until then the deploy job fails; build + check
# are unaffected. See site/README.md for the equivalent `gh api` command.

name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
      - "ui/assets/**"
      - "icons/**"
      - "biome.json"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
      - "ui/assets/**"
      - "icons/**"
      - "biome.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run. Runs on main queue instead of
# cancelling, so a deployment is never cut off halfway.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build + check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Node.js (v24) with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Root tooling only (Biome). --ignore-scripts skips husky's hook setup.
      - name: Install root JS tooling (Biome)
        run: npm ci --ignore-scripts

      - name: Lint site JS and CSS (Biome)
        run: npx biome ci site --error-on-warnings

      # Optional: lets build.mjs ship WebP screenshots (60-80% smaller).
      # Without it the build still works and serves the PNGs.
      - name: Install cwebp
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends webp

      - name: Build site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          export SITE_BASE="/${repo}/"
          export SITE_URL="https://${owner}.github.io/${repo}/"
          echo "SITE_BASE=${SITE_BASE}" >> "$GITHUB_ENV"
          node site/scripts/build.mjs

      - name: Check site
        run: node site/scripts/check.mjs _site --base "$SITE_BASE"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
