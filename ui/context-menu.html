<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>
    <link rel="stylesheet" href="css/shared-kage-tokens.css">
    <link rel="stylesheet" href="css/shared-rtl.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            background-color: transparent;
        }
        body {
            font-family: var(--kage-font);
            overflow: hidden;
            padding: 8px;
            /* The menu's own size decides the window's (see menu-window.js),
               so it must not stretch to whatever the window is now. */
            width: max-content;
        }
        .menu {
            width: max-content;
            min-width: 150px;
            max-width: 420px;
            background: #2a2a2e;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 4px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            font-size: 13px;
            outline: none;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 7px 20px;
            color: #ddd;
            cursor: pointer;
            white-space: nowrap;
            text-align: start;
            outline: none;
            transition: background 0.1s;
        }
        .menu-label {
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .menu-shortcut {
            margin-inline-start: auto;
            opacity: 0.6;
            font-size: 12px;
        }
        .menu-item.highlighted { background: var(--kage-accent); color: #fff; }
        .menu-item.danger { color: #ff8a80; }
        .menu-item.danger.highlighted { background: #c62828; color: #fff; }
        .menu-item.disabled { opacity: 0.45; cursor: default; }
        .menu-item.disabled.highlighted { background: transparent; color: #ddd; }
        .menu-sep { height: 1px; background: #444; margin: 4px 0; }
    </style>
</head>
<body>
    <div class="menu" id="menu" aria-label="Menu" data-i18n-aria-label="context_menu.aria_label"></div>
    <script type="module">
        import { applyTheme, initThemeListener, loadAndApplyTheme } from './js/shared/theme.js';
        import { initI18n, applyStaticTranslations, isRtl, t } from './js/shared/i18n.js';
        import { initLinkHandler } from './js/shared/link-handler.js';
        import { startMenuWindow } from './js/context-menu/menu-window.js';

        (async function() {
            const { invoke } = window.__TAURI__.core;
            const { listen, emitTo } = window.__TAURI__.event;
            initLinkHandler(invoke);
            const appWindow = window.__TAURI__.webviewWindow.getCurrentWebviewWindow();

            try { await initI18n(invoke); } catch (e) { console.warn('[context-menu] i18n init failed', e); }
            applyStaticTranslations(document);

            initThemeListener();
            loadAndApplyTheme(invoke).catch(() => applyTheme('system'));

            // Dev mode adds Inspect to the default text menu. Checked once.
            let dev = false;
            try { dev = !!(await invoke('is_dev_mode')); } catch (e) {}

            startMenuWindow({
                invoke,
                listen,
                emitTo,
                appWindow,
                root: document.getElementById('menu'),
                t,
                devMode: () => dev,
                isRtl,
            });
        })();
    </script>
</body>
</html>
