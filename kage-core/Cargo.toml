# Shared core between the `kage` app and the `kage-computer-control-mcp`
# sidecar. Deliberately tiny: no Tauri, no webview, no i18n catalogs —
# the sidecar links this instead of the full app crate so a clean sidecar
# build is seconds/megabytes instead of minutes/gigabytes, and CI stops
# compiling the app graph twice per platform.
[package]
name = "kage-core"
version.workspace = true
edition = "2021"
publish = false

[features]
# The OS layer and everything on top of it: accessibility, input,
# launcher, folder tools, computer control, per-user paths and the
# changelog cache. On by default. The file text worker (kage-file-text)
# turns it off: it needs only the wire types, and a process that parses
# untrusted files shouldn't load AppKit, UI Automation and the rest.
default = ["os"]
os = [
    "dep:anyhow",
    "dep:base64",
    "dep:chrono",
    "dep:dirs",
    "dep:winreg",
    "dep:windows-collections",
    "dep:uiautomation",
    "dep:windows",
    "dep:core-graphics",
    "dep:core-foundation",
    "dep:accessibility-sys",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]

[dependencies]
anyhow = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", optional = true }
dirs = { version = "6.0", optional = true }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.56", optional = true }
windows-collections = { version = "0.3", optional = true }
# UIA-based accessibility tree + keyboard/mouse synthesis.
uiautomation = { version = "0.24", features = ["process", "control", "input"], optional = true }
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Management_Deployment",
    "ApplicationModel",
    "ApplicationModel_Core",
    "Foundation",
    "Foundation_Collections",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# CGEvent-based input synthesis + AX accessibility provider.
core-graphics = { version = "0.25", features = ["highsierra"], optional = true }
core-foundation = { version = "0.10", optional = true }
accessibility-sys = { version = "0.2", optional = true }
# NSWorkspace/NSRunningApplication enumeration for the AX window
# discovery in os/macos/accessibility/tree.rs. Same versions/features as
# the app crate so the dep graph stays unified.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"], optional = true }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"], optional = true }

[dev-dependencies]
tempfile = "3"
